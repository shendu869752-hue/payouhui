<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帕友慧 · 运动障碍疾病诊疗助手</title>
<style>
  :root {
    --navy: #304156;
    --bg: #f3f8ff;
    --card: #ffffff;
    --border: #e4eaf3;
    --blue: #3b82f6;
    --text: #363636;
    --muted: #8a94a6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ===== 侧栏 ===== */
  .sidebar {
    width: 220px; flex: 0 0 220px; background: var(--navy);
    display: flex; flex-direction: column; padding: 22px 14px 16px;
  }
  .logo { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; }
  .logo-icon {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 11px;
    background: transparent; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .logo-icon img { width: 100%; height: 100%; object-fit: contain; }
  .logo-name { color: #fff; font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .logo-sub { color: rgba(255,255,255,.55); font-size: 11px; margin-top: 2px; }

  .menu-label { color: rgba(255,255,255,.45); font-size: 11.5px; letter-spacing: 2px; margin: 4px 8px 10px; }
  .menu { flex: 1; overflow-y: auto; }
  .qa-item {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 12px; margin-bottom: 7px; border-radius: 10px; cursor: pointer;
    color: #dfe7f0; font-size: 13px; line-height: 1.5; transition: background .15s;
  }
  .qa-item .qnum {
    flex: 0 0 19px; height: 19px; border-radius: 6px;
    background: rgba(255,255,255,.12); color: #fff;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  .qa-item:hover { background: rgba(255,255,255,.12); }
  .side-foot { color: rgba(255,255,255,.4); font-size: 11px; line-height: 1.7; padding: 10px 8px 0; }

  /* ===== 主区 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 18px 24px 12px; }

  /* 顶栏：中间偏上放 新对话 + 历史菜单 */
  .topbar { position: relative; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .topbar .hello { flex: 1; min-width: 0; font-size: 14.5px; }
  .topbar .hello b { color: var(--navy); }
  .topbar .hello .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .top-center { display: flex; align-items: center; gap: 8px; }
  .btn-new {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 10px; cursor: pointer;
    background: var(--blue); color: #fff; border: none;
    font-size: 13.5px; font-weight: 600; transition: background .15s;
    box-shadow: 0 3px 10px rgba(59,130,246,.3);
  }
  .btn-new:hover { background: #2f74e8; }
  .btn-new .plus { font-size: 16px; line-height: 1; }
  .btn-menu {
    width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--border); color: var(--navy);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; transition: background .15s;
  }
  .btn-menu:hover { background: #eef4ff; }
  .online-badge {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 999px; background: #eef6ff; border: 1px solid #d3e6fd;
    color: #2563eb; font-size: 12px; white-space: nowrap;
  }
  .online-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }

  /* 历史记录下拉 */
  .history-panel {
    display: none; position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
    width: 320px; max-height: 380px; overflow-y: auto; z-index: 50;
    background: #fff; border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 32px rgba(48,65,86,.18); padding: 8px;
  }
  .history-panel.show { display: block; }
  .history-item {
    padding: 11px 12px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .history-item:hover { background: #f3f8ff; }
  .history-item .t { flex: 1; font-size: 13px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .history-empty { padding: 18px 12px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ===== 中部 ===== */
  .content { flex: 1; display: flex; gap: 16px; min-height: 0; }

  .doctor-card {
    width: 268px; flex: 0 0 268px;
    background: transparent; border: none; border-radius: 0; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .doctor-card img { width: auto; height: 84vh; object-fit: contain; padding: 0; transform: scale(1.06); transform-origin: 50% 100%; }

  /* ===== 聊天卡片（纯白） ===== */
  .chat-card {
    flex: 1; min-width: 0; background: transparent;
    border: none; border-radius: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .msg-list { flex: 1; overflow-y: auto; padding: 20px 22px 10px; }
  .msg { display: flex; gap: 10px; margin-bottom: 16px; }
  .msg .ava {
    width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%;
    background: transparent; border: 1px solid #e6edf5; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .msg .ava img { width: 100%; height: 100%; object-fit: contain; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .ava { background: var(--blue); border-color: var(--blue); }
  .bubble {
    max-width: 72%; padding: 11px 15px; border-radius: 14px;
    font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble { background: transparent; border: none; border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--blue); color: #fff; border-top-right-radius: 4px; }
  .msg .err { color: #dc2626; font-size: 12.5px; }

  /* 等待状态：数字人思考 */
  .think-ui { display: flex; align-items: center; gap: 12px; padding: 4px 2px; min-width: 240px; }
  .think-avatar {
    width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%;
    background: transparent; border: 1px solid #e6edf5; overflow: hidden;
    animation: breathe 1.8s ease-in-out infinite;
  }
  .think-avatar img { width: 100%; height: 100%; object-fit: contain; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, .28); }
    50% { transform: scale(1.07); box-shadow: 0 0 0 9px rgba(59, 130, 246, 0); }
  }
  .think-text { font-size: 13.5px; color: var(--muted); }
  .dots i { font-style: normal; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }
  /* 引用符号 */
  sup.cm {
    color: var(--blue); cursor: pointer; font-weight: 700;
    padding: 0 2px; position: relative; font-size: 10.5px;
  }
  sup.cm .tip {
    display: none; position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%);
    width: 280px; background: #2e3d50; color: #eef3f8; font-size: 11.5px; line-height: 1.65;
    border-radius: 9px; padding: 9px 11px; z-index: 70; text-align: left; font-weight: 400;
    box-shadow: 0 8px 22px rgba(23,35,50,.28);
  }
  sup.cm .tip::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #2e3d50;
  }
  sup.cm:hover .tip { display: block; }
  .tip .t-doc { font-weight: 700; color: #9ec3ff; display: block; margin-bottom: 3px; }
  .tip .t-quote { color: #cfe0f0; }
  .cite {
    margin-top: 9px; font-size: 12px; color: var(--muted);
    border-top: 1px dashed var(--border); padding-top: 8px; line-height: 1.6;
  }

  .empty-tip { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; line-height: 2; }

  /* 回答结构化排版 */
  .bubble .md-h1, .bubble .md-h2, .bubble .md-h3 {
    font-weight: 700; color: var(--navy); margin: 10px 0 6px; line-height: 1.5;
  }
  .bubble .md-h1 { font-size: 15px; }
  .bubble .md-h2 { font-size: 14.5px; }
  .bubble .md-h3 { font-size: 14px; }
  .bubble ol { margin: 4px 0 8px; padding-left: 22px; }
  .bubble ol li { margin: 3px 0; line-height: 1.7; }
  .bubble .md-li { margin: 3px 0 3px 14px; line-height: 1.7; }
  .bubble .md-br { height: 6px; }
  .bubble .md-line { line-height: 1.7; }
  .bubble strong { color: var(--navy); }
  .msg-actions {
    display: flex; gap: 16px; margin-top: 9px; padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .msg-actions .act { font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .msg-actions .act:hover { color: var(--blue); }

  /* 输入条 */
  .input-bar {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 16px; background: transparent;
  }
  .input-bar textarea {
    flex: 1; resize: none; border: 1.5px solid var(--border); border-radius: 12px;
    padding: 11px 14px; font-size: 14px; font-family: inherit; color: var(--text);
    outline: none; height: 46px; max-height: 120px; line-height: 1.5;
  }
  .input-bar textarea:focus { border-color: var(--blue); }
  .btn-send {
    height: 46px; padding: 0 26px; border: none; border-radius: 12px;
    background: var(--blue); color: #fff; font-size: 14.5px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .btn-send:hover { background: #2f74e8; }
  .btn-send:disabled { background: #a8c6f5; cursor: not-allowed; }

  .footer { padding: 10px 2px 0; text-align: center; color: var(--muted); font-size: 11.5px; }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: rgba(38,51,66,.95); color: #fff; padding: 10px 22px;
    border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 99;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .app { flex-direction: column; height: auto; overflow: visible; }
    .sidebar { display: none; }
    .doctor-card { display: none; }
    .main { padding: 12px 10px; }
    .chat-card { height: 74vh; }
    .online-badge { display: none; }
    .history-panel { left: auto; right: 0; transform: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- 侧栏 -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon"><img src="形象4.png" alt=""></div>
      <div>
        <div class="logo-name">帕友慧</div>
        <div class="logo-sub">运动障碍诊疗助手</div>
      </div>
    </div>
    <div class="menu-label">常见问题</div>
    <div class="menu">
      <div class="qa-item" data-q="帕金森病早期有哪些症状？"><span class="qnum">1</span>帕金森病早期有哪些症状？</div>
      <div class="qa-item" data-q="左旋多巴服药有哪些注意事项？"><span class="qnum">2</span>左旋多巴服药有哪些注意事项？</div>
      <div class="qa-item" data-q="什么情况适合做DBS手术？"><span class="qnum">3</span>什么情况适合做DBS手术？</div>
      <div class="qa-item" data-q="MDS-UPDRS量表是评估什么的？"><span class="qnum">4</span>MDS-UPDRS量表是评估什么的？</div>
    </div>
    <div class="side-foot">⚠️ 本助手仅供科普参考，不能替代医生面诊。</div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <div class="topbar">
      <div class="hello">
        您好，我是神经内科张雷医生😊 可以问我帕金森病用药、症状、DBS 手术、康复锻炼、量表解读等问题。
        <div class="sub">结论先行、通俗易懂 · 点击左侧常见问题快速提问</div>
      </div>
      <div class="top-center">
        <button class="btn-new" id="btnNew"><span class="plus">＋</span>新对话</button>
        <div class="btn-menu" id="btnMenu" title="历史聊天记录">☰</div>
      </div>
      <div class="online-badge"><span class="dot"></span>在线 · 智能问答</div>

      <!-- 历史记录面板 -->
      <div class="history-panel" id="historyPanel">
        <div class="history-empty" id="historyEmpty">暂无历史聊天记录</div>
        <div id="historyList"></div>
      </div>
    </div>

    <div class="content">
      <div class="doctor-card"><img src="形象4.png" alt="帕友慧"></div>

      <div class="chat-card">
        <div class="msg-list" id="msgList">
          <div class="empty-tip" id="emptyTip">
            您好，我是神经内科张雷医生😊 可以问我帕金森病用药、症状、DBS 手术、康复锻炼、量表解读等问题。
          </div>
        </div>
        <div class="input-bar">
          <textarea id="input" placeholder="请输入您的问题，例如：帕金森病早期有哪些症状？" rows="1"></textarea>
          <button class="btn-send" id="btnSend">发送</button>
        </div>
      </div>
    </div>

    <div class="footer">帕友慧 · 宿州市立医院运动障碍疾病智能体 · Powered by Dify</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============ 配置 ============ */
const API_KEY = 'app-Tl3Dvzia2BVnnlS1AGdALETA';   // Dify 应用 API 密钥（知识库模式）
const API_BASE = 'https://api.dify.ai/v1';

/* ============ 会话存储 ============ */
const LS_CONVS = 'payouhui_convs_v1';
const LS_CUR = 'payouhui_cur_v1';
let convs = JSON.parse(localStorage.getItem(LS_CONVS) || '[]');
let curId = localStorage.getItem(LS_CUR) || null;

function saveConvs() { localStorage.setItem(LS_CONVS, JSON.stringify(convs)); }
function saveCur() { localStorage.setItem(LS_CUR, curId || ''); }
function uid() {
  let u = localStorage.getItem('payouhui_uid');
  if (!u) { u = 'web-' + Math.random().toString(36).slice(2, 12); localStorage.setItem('payouhui_uid', u); }
  return u;
}
function curConv() { return convs.find(c => c.id === curId) || null; }

function startNewConv() {
  curId = 'c' + Date.now().toString(36);
  convs.unshift({ id: curId, difyConvId: null, title: '新对话', msgs: [], ts: Date.now() });
  saveConvs(); saveCur(); renderMsgs(); renderHistory();
  hidePanel();
}

function renderMsgs() {
  const list = document.getElementById('msgList');
  const c = curConv();
  const tip = document.getElementById('emptyTip');
  list.querySelectorAll('.msg').forEach(m => m.remove());
  if (!c || c.msgs.length === 0) {
    if (!tip) list.insertAdjacentHTML('beforeend', '<div class="empty-tip" id="emptyTip">您好，我是神经内科张雷医生😊 可以问我帕金森病用药、症状、DBS 手术、康复锻炼、量表解读等问题。</div>');
  } else {
    if (tip) tip.remove();
    c.msgs.forEach((m, i) => list.insertAdjacentHTML('beforeend', msgHTML(m, i)));
    list.scrollTop = list.scrollHeight;
  }
}
function cleanAnswer(a) {
  // 只剥掉推理思考块，保留 markdown 结构（交给 mdToHtml 渲染）
  return (a || '').replace(/<think>[\s\S]*?<\/think>/g, '').trim();
}
function mdToHtml(t) {
  const lines = escapeHTML(t).split('\n');
  let html = '', inOl = false;
  const bold = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const raw of lines) {
    let line = raw.trim();
    if (/^#{1,3}\s+/.test(line)) {
      if (inOl) { html += '</ol>'; inOl = false; }
      const lvl = (line.match(/^#+/) || ['#'])[0].length;
      line = bold(line.replace(/^#{1,3}\s+/, ''));
      html += `<div class="md-h${lvl}">${line}</div>`;
    } else if (/^\d+[.、]\s*/.test(line)) {
      if (!inOl) { html += '<ol>'; inOl = true; }
      html += `<li>${bold(line.replace(/^\d+[.、]\s*/, ''))}</li>`;
    } else if (/^[-•·]\s+/.test(line)) {
      if (inOl) { html += '</ol>'; inOl = false; }
      html += `<div class="md-li">· ${bold(line.replace(/^[-•·]\s+/, ''))}</div>`;
    } else if (line === '') {
      if (inOl) { html += '</ol>'; inOl = false; }
      html += '<div class="md-br"></div>';
    } else {
      if (inOl) { html += '</ol>'; inOl = false; }
      html += `<div class="md-line">${bold(line)}</div>`;
    }
  }
  if (inOl) html += '</ol>';
  return html;
}
function withCitations(html, retrieval) {
  if (!retrieval || !retrieval.length) return html;
  return html.replace(/\[(\d{1,2})\]/g, (m, n) => {
    const it = retrieval[parseInt(n, 10) - 1];
    if (!it) return m;
    const meta = it.metadata || {};
    const src = escapeHTML(meta.document_name || '知识库文档');
    const quote = escapeHTML((it.content || '').replace(/\s+/g, ' ').slice(0, 130));
    return '<sup class="cm"><span class="tip"><span class="t-doc">📄 ' + src + '</span>' +
      '<span class="t-quote">' + quote + '…</span></span>[' + n + ']</sup>';
  });
}
function msgHTML(m, idx) {
  const isUser = m.role === 'user';
  let content, actions = '';
  if (isUser) {
    content = escapeHTML(m.content);
  } else {
    content = withCitations(mdToHtml(cleanAnswer(m.content)), m.retrieval);
    actions = `<div class="msg-actions">` +
      `<span class="act" data-act="copy" data-idx="${idx}">📋 复制</span>` +
      `<span class="act" data-act="retry" data-idx="${idx}">🔄 重新回答</span></div>`;
  }
  return `<div class="msg ${m.role}">` +
    `<div class="ava">${isUser ? '<span style="color:#fff;font-size:14px">我</span>' : '<img src="形象4.png">'}</div>` +
    `<div class="bubble">${content}${actions}</div></div>`;
}
function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderHistory() {
  const box = document.getElementById('historyList');
  box.innerHTML = '';
  if (convs.length === 0) {
    document.getElementById('historyEmpty').style.display = 'block';
    return;
  }
  document.getElementById('historyEmpty').style.display = 'none';
  convs.forEach(c => {
    const div = document.createElement('div');
    div.className = 'history-item';
    const title = c.msgs.find(m => m.role === 'user')?.content.slice(0, 18) || c.title;
    const t = new Date(c.ts);
    div.innerHTML = `<span class="t">${escapeHTML(title)}</span><span class="time">${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</span>`;
    div.onclick = () => { curId = c.id; saveCur(); renderMsgs(); hidePanel(); };
    box.appendChild(div);
  });
}
function hidePanel() { document.getElementById('historyPanel').classList.remove('show'); }

/* ============ 发送 ============ */
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

async function send(q) {
  q = (q || input.value).trim();
  if (!q) return;
  if (!API_KEY) { toast('聊天接口未配置：请先在 Dify 应用中创建 API 密钥'); return; }
  if (!curConv()) startNewConv();
  const c = curConv();
  if (c.title === '新对话') c.title = q.slice(0, 18);
  c.msgs.push({ role: 'user', content: q });
  input.value = ''; input.style.height = '46px';
  renderMsgs(); renderHistory();
  const list = document.getElementById('msgList');
  const bubbleEl = document.createElement('div');
  bubbleEl.className = 'msg assistant';
  bubbleEl.innerHTML = '<div class="ava"><img src="形象4.png"></div><div class="bubble"></div>';
  list.appendChild(bubbleEl);
  const bubble = bubbleEl.querySelector('.bubble');
  bubble.innerHTML = '<div class="think-ui"><div class="think-avatar"><img src="形象4.png"></div><div class="think-text">请稍后，张雷医生在思考，尽快回复您<span class="dots"><i>.</i><i>.</i><i>.</i></span></div></div>';
  const procStart = Date.now();
  let retrieval = [];
  list.scrollTop = 1e9;
  btnSend.disabled = true;

  try {
    const body = {
      inputs: {}, query: q, response_mode: 'streaming', user: uid(),
      conversation_id: c.difyConvId || undefined
    };
    const r = await fetch(API_BASE + '/chat-messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
      body: JSON.stringify(body)
    });
    if (!r.ok || !r.body) { throw new Error('接口错误 ' + r.status); }

    const reader = r.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '', answer = '', first = true;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let ev;
        try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.event === 'node_finished') {
          const d = ev.data || {};
          if ((d.node_type || '').includes('retrieval')) {
            const items = (d.outputs && d.outputs.result) || [];
            retrieval = items.slice(0, 5).map(it => ({
              metadata: it.metadata || {},
              content: (it.content || '').slice(0, 300)
            }));
          }
        } else if (ev.event === 'message' || ev.event === 'agent_message') {
          answer += ev.answer || '';
          if (first) {
            first = false;
            const remaining = Math.max(0, 1600 - (Date.now() - procStart));
            setTimeout(() => { bubble.innerHTML = ''; bubble.textContent = answer; list.scrollTop = 1e9; }, remaining);
          } else if (!bubble.querySelector('.proc')) {
            bubble.textContent = answer;
            list.scrollTop = 1e9;
          }
        } else if (ev.event === 'message_end') {
          c.difyConvId = ev.conversation_id || c.difyConvId;
          const docs = ((ev.metadata && ev.metadata.retriever_resources) || [])
            .map(r => r.document_name).filter(Boolean);
          if (docs.length) {
            const uniq = [...new Set(docs)].slice(0, 3).join('、');
            bubble.insertAdjacentHTML('beforeend',
              '<div class="cite">📚 参考知识库：' + escapeHTML(uniq) + (docs.length > 3 ? ' 等' : '') + '</div>');
          }
        } else if (ev.event === 'error') {
          throw new Error(ev.message || '服务错误');
        }
      }
    }
    c.msgs.push({ role: 'assistant', content: answer || '(无回答)', retrieval });
    saveConvs();
  } catch (e) {
    bubbleEl.remove();
    c.msgs.push({ role: 'assistant', content: '⚠️ 请求失败：' + e.message + '。请稍后重试。' });
    saveConvs();
  }
  btnSend.disabled = false;
  renderMsgs();
}

document.getElementById('btnSend').addEventListener('click', () => send());
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = '46px';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
document.getElementById('btnNew').addEventListener('click', startNewConv);
document.getElementById('btnMenu').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('historyPanel').classList.toggle('show');
  renderHistory();
});
document.addEventListener('click', e => {
  if (!e.target.closest('#historyPanel') && !e.target.closest('#btnMenu')) hidePanel();
});
document.querySelectorAll('.qa-item').forEach(el => {
  el.addEventListener('click', () => { input.value = el.dataset.q; send(); });
});

/* 回答操作条：复制 / 重新回答 */
document.getElementById('msgList').addEventListener('click', e => {
  const btn = e.target.closest('.act');
  if (!btn) return;
  const c = curConv();
  if (!c) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const m = c.msgs[idx];
  if (!m) return;
  if (btn.dataset.act === 'copy') {
    copyText(cleanAnswer(m.content));
    toast('回答已复制');
  } else if (btn.dataset.act === 'retry') {
    const prev = c.msgs.slice(0, idx).reverse().find(x => x.role === 'user');
    if (prev) send(prev.content);
  }
});

renderMsgs(); renderHistory();
</script>
</body>
